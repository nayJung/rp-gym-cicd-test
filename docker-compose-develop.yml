services:

  # PostgreSQL
  postgres-user:
    image: postgres:16
    container_name: rp-gym-postgres-user
    restart: unless-stopped
    ports:
      - "19040:5432"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-health:
    image: postgres:16
    container_name: rp-gym-postgres-health
    restart: unless-stopped
    ports:
      - "19041:5432"
    environment:
      POSTGRES_DB: health_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-health-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-game:
    image: postgres:16
    container_name: rp-gym-postgres-game
    restart: unless-stopped
    ports:
      - "19042:5432"
    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-game-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # kafka
  kafka:
    image: apache/kafka:4.3.1
    container_name: rp-gym-kafka
    restart: unless-stopped
    ports:
      - "19030:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19030
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-network

  # redis
  redis:
    image: redis:latest
    container_name: rp-gym-redis
    restart: unless-stopped
    ports:
      - "19031:6379"
    volumes:
      - redis-data:/data
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
    networks:
      - app-network

volumes:
  kafka-data:
  redis-data:
  postgres-user-data:
  postgres-health-data:
  postgres-game-data:

networks:
  app-network:
    name: rp-gym-network
    driver: bridge