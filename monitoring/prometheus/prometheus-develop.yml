global:
  scrape_interval: 15s

scrape_configs:

  # 개발 환경에서는 서비스가 호스트에서 실행되므로
  # Prometheus 컨테이너에서 host.docker.internal로 접근한다.

  - job_name: eureka
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:19000

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:19091

  - job_name: user
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:19010

  - job_name: health
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:19011

  - job_name: game
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:19012

  - job_name: notification
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:19013
