server:
  port: 19011

spring:
  application:
    name: health-service

  config:
    # 서비스 디렉터리의 .env를 프로퍼티 파일로 읽는다.
    # 확장자가 없으므로 [.properties]로 파서를 지정한다.
    # optional: 이므로 파일이 없어도 기동에 실패하지 않는다(Docker/CI).
    # OS 환경변수가 우선순위가 높으므로 Compose의 env_file이 항상 이긴다.
    # 실행 위치에 따라 작업 디렉터리가 달라지므로 두 경로를 모두 시도한다.
    # (모듈 디렉터리에서 실행 / 프로젝트 루트에서 실행)
    import:
      - optional:file:.env[.properties]
      - optional:file:health-service/.env[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      # Outbox payload를 문자열 원문 그대로 싣는다. 직렬화기가 값을 다시 만들지 않도록 String으로 고정
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # "보냈다"고 인정하는 기준 -> all : 복제본까지 전부 받아야 성공 처리
      # (0 : 던지고 확인 안 함. 제일 빠르고 제일 잘 잃어버림, 1 : 리더 브로커 한 대만 받으면 성공 처리 -> 아무도 모르게 메세지가 없는 영구유실 가능성.)
      acks: all
      properties:
        # 프로듀서 내부 재시도로 인한 중복 적재 방지 + 파티션 내 순서 보장
        enable.idempotence: true
        # 응답을 안 받고도 미리 보낼 수 있는 요청 개수(enable.idempotence가 켜져 있으면 Kafka가 5 이하에서만 순서를 보장해줌. idempotence가 켜져 있으면 기본값 :5)
        max.in.flight.requests.per.connection: 5
        # 한 번의 시도를 얼마나 기다릴지
        request.timeout.ms: 10000
        # 재시도 전부 합쳐서 얼마나 버틸지
        delivery.timeout.ms: 30000

  jpa:
    hibernate:
      # Flyway가 DDL을 관리하므로 Hibernate는 매핑 검증만 수행
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Health Service가 소유한 스키마
        default_schema: health_service
    open-in-view: false

  flyway:
    schemas: health_service
    baseline-on-migrate: true

  jackson:
    serialization:
      # 날짜/시각을 epoch 숫자가 아닌 ISO-8601 문자열로 직렬화
      write-dates-as-timestamps: false

  cloud:
    openfeign:
      client:
        config:
          default:
            # User Service 호출이 sync() 트랜잭션 안에서 일어나므로,
            # 응답이 늦으면 DB 커넥션을 오래 붙잡는다. 짧게 끊고 fallback으로 넘어간다.
            connect-timeout: 2000
            read-timeout: 3000

rpgym:
  outbox:
    # PENDING 폴링 주기 (ms)
    poll-interval: 1000
    # 한 라운드에 처리할 최대 건수
    poll-size: 100
    # 이 횟수만큼 실패하면 DLQ로 보내고 FAILED로 종료한다
    max-retry: 5
    # Kafka 발행 응답 대기 시간
    send-timeout: 5s
    # Health Service가 발행하는 모든 이벤트를 한 토픽으로 보낸다.
    # 종류별로 나누면 같은 sync에서 나간 이벤트들이 서로 다른 토픽으로 흩어져
    # 소비 순서가 뒤집힌다. (Quest baseline이 옛날 누적값으로 고정되는 문제)
    topic: health.events
    dlq-suffix: .dlq

    # 미발행/실패 적체 지표 갱신 주기 (ms)
    # 매 폴링마다 count 쿼리를 돌리면 낭비이므로 별도 주기로 둔다
    backlog-refresh-interval: 30000

    cleanup:
      # 정리 배치 사용 여부. 끄면 스케줄러 빈 자체가 생성되지 않는다
      enabled: true
      # 매일 04:10 (KST). 트래픽이 가장 적은 시간대
      cron: "0 10 4 * * *"
      # 발행 완료 후 이 기간이 지난 행을 삭제한다
      retention: 7d
      # 한 트랜잭션에서 삭제할 건수. 크면 락 점유가 길어진다
      batch-size: 500
      # 1회 실행 시간 상한. 건수가 아니라 시간으로 끊는다.
      # 건수로 끊으면 하루 유입량이 상한보다 많을 때 영영 따라잡지 못한다.
      max-run-duration: 10m
  synthetic:
    # 기본 비활성. 로컬에서 확인할 때만 켠다.
    enabled: false
    # 수집 주기 (ms). Outbox 폴링(1초)과 겹치면 로그가 섞여 디버깅이 어려우므로 넉넉히 둔다.
    interval-ms: 60000
    # 데이터를 생성할 대상 사용자 (회원가입 후 발급된 UUID를 넣는다)
    # 대상 사용자는 로컬 계정마다 다르므로 여기에 커밋하지 않는다.
    # health-service/.env 에 넣으면 이 값을 덮어쓴다 (.env는 gitignore 대상).
    #   rpgym.synthetic.user-ids=UUID1,UUID2,UUID3
    user-ids: [ ]
    # 한 번의 수집에서 더할 최대 증가분
    max-steps-per-tick: 300
    max-active-minutes-per-tick: 2
    max-active-calories-per-tick: 20

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

  client:
    # Eureka Server에 Health Service 등록
    register-with-eureka: true

    # Eureka Registry의 서비스 목록을 가져옴
    fetch-registry: true

    service-url:
      # Eureka Server 주소
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:19000/eureka/}

management:
  endpoints:
    web:
      exposure:
        # HTTP로 노출할 Actuator Endpoint
        # health: 애플리케이션 상태 확인, info: 애플리케이션 정보 확인, prometheus: 메트릭 수집용
        include: health, info, prometheus